[package]
name = "binary-editor"
version = "0.1.0"
description = "Convert data, scripts and source code to binary and back"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "binary_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = "0.10"
plist = "1"
tokio = { version = "1", features = ["process", "time", "fs", "io-util"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util"] }
